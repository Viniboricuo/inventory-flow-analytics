<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fluxo de Estoque · Demo Retail Co.</title>
  <meta name="description" content="Projeto de portfólio: painel de fluxo de estoque com dados sintéticos (modelo estrela, aging, cobertura, giro e validação).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23173430'/%3E%3Cpath d='M9 22V12m7 10V8m7 14v-6' stroke='%2363cbb4' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // apply the saved theme before first paint
    try { const t = localStorage.getItem("ifa-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="monogram" aria-hidden="true">DR</div>
      <div class="brand-text">
        <strong>Fluxo de Estoque</strong>
        <span>Demo Retail Co.</span>
      </div>
      <button class="collapse-btn" id="btn-collapse" type="button" aria-label="Recolher menu" aria-expanded="true" title="Recolher menu">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav" aria-label="Páginas"></nav>

    <div class="side-foot">
      <p class="status" id="data-status"><b><i class="ok-dot" aria-hidden="true"></i>Gerando dados…</b></p>
      <div class="foot-btns">
        <button class="btn ghost" id="btn-seed" type="button" title="Gera outro conjunto sintético (nova semente)">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Nova semente</span>
        </button>
        <button class="btn ghost square" id="btn-theme" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="quick" id="quick" role="group" aria-label="Filtros rápidos"></div>
      <button class="btn filter-btn" id="btn-filters" type="button" aria-controls="filter-panel" aria-expanded="false">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg><span>Filtros</span>
      </button>
      <section class="filter-panel" id="filter-panel" aria-label="Filtros" hidden></section>
    </header>

    <header class="page-head">
      <div>
        <p class="eyebrow"><i class="dot" aria-hidden="true"></i>Gestão de Estoque</p>
        <h1 id="page-title">Visão Geral</h1>
        <p class="subtitle" id="page-subtitle"></p>
      </div>
      <label class="ref-month" title="Mês de referência (fechamento usado em custo, cobertura, giro e aging)">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <select id="ref-month" aria-label="Mês de referência"></select>
      </label>
    </header>

    <section class="kpis" id="kpis" aria-label="Indicadores"></section>
    <main class="content" id="content"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/pages-analysis.js"></script>
<script src="js/pages-operations.js"></script>
</body>
</html>
